<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1b0b07">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Arcano Especias - Plataforma de gestion">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Arcano Admin</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Landscape lock overlay */
    #landscape-warn {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: #1b0b07; color: #e8b84b;
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 32px; gap: 16px;
    }
    #landscape-warn .rotate-icon {
      width: 64px; height: 64px; border: 4px solid #e8b84b;
      border-radius: 12px; position: relative;
      animation: rotate-phone 2s ease-in-out infinite;
    }
    #landscape-warn .rotate-icon::after {
      content: ''; position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
      width: 70%; height: 3px; background: #e8b84b; border-radius: 2px;
    }
    @keyframes rotate-phone {
      0%, 20% { transform: rotate(0deg); }
      40%, 60% { transform: rotate(-90deg); }
      80%, 100% { transform: rotate(0deg); }
    }
    @media screen and (orientation: landscape) and (max-width: 768px) {
      #landscape-warn { display: flex !important; }
      body > *:not(#landscape-warn) { display: none !important; }
    }
    /* Install banner */
    #pwa-install-bar {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 800;
      background: #2a150e; border-top: 2px solid #e8b84b;
      padding: 12px 16px; align-items: center; gap: 12px;
    }
    #pwa-install-bar .pwa-text { flex: 1; color: #ece0d0; font-size: 0.85rem; }
    #pwa-install-bar .pwa-text strong { color: #e8b84b; }
    #pwa-install-bar button { white-space: nowrap; }
  </style>
</head>
<body>
  <div id="landscape-warn">
    <div class="rotate-icon"></div>
    <div style="font-size:1.2rem;font-weight:800">Usa en vertical</div>
    <div style="font-size:0.85rem;color:#9a8a78">Gira tu dispositivo para continuar</div>
  </div>

  <div id="app-root"></div>

  <div id="pwa-install-bar">
    <div class="pwa-text"><strong>Instalar Arcano</strong><br>Acceso rapido desde tu pantalla de inicio</div>
    <button class="btn btn-sm btn-outline" onclick="document.getElementById('pwa-install-bar').style.display='none'">Despues</button>
    <button class="btn btn-sm btn-gold" id="pwa-install-btn" onclick="App.installPWA()">Instalar</button>
  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- SheetJS for Excel parsing -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <!-- Chart.js for statistics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <!-- Tesseract.js for OCR label reading -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- App -->
  <script src="js/db.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/core.js"></script>

  <!-- PWA: Service Worker + Orientation Lock + Install -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      });
    }
    // Lock orientation to portrait when installed as PWA
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('portrait').catch(function() {});
    }
  </script>
</body>
</html>
